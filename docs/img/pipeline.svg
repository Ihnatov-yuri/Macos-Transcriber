<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Menlo, ui-monospace, monospace">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#1A1918" stroke-width="1.6"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#E24A2E" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="#F4EFE3"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#1A1918" font-weight="bold">THE SHAPE OF THE MACHINE</text>
  <text x="40" y="72" font-size="11" fill="#8a857c">every recording, one pipeline · no audio leaves the mac</text>

  <!-- Record -->
  <rect x="40" y="120" width="150" height="86" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="58" y="150" font-size="13" fill="#1A1918" font-weight="bold">RECORD</text>
  <text x="58" y="172" font-size="10.5" fill="#8a857c">mic · or meeting</text>
  <text x="58" y="188" font-size="10.5" fill="#8a857c">tap (system audio)</text>
  <circle cx="168" cy="146" r="5" fill="#E24A2E"/>

  <!-- Decode -->
  <line x1="190" y1="163" x2="238" y2="163" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="242" y="120" width="150" height="86" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="260" y="150" font-size="13" fill="#1A1918" font-weight="bold">DECODE + VAD</text>
  <text x="260" y="172" font-size="10.5" fill="#8a857c">silence-aware</text>
  <text x="260" y="188" font-size="10.5" fill="#8a857c">chunks</text>

  <!-- Engines -->
  <line x1="392" y1="163" x2="440" y2="163" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="444" y="86" width="196" height="238" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="462" y="114" font-size="13" fill="#1A1918" font-weight="bold">ASR ENGINES</text>
  <rect x="462" y="130" width="160" height="38" fill="#1A1918"/>
  <text x="474" y="149" font-size="11" fill="#F4EFE3">PARAKEET</text>
  <text x="474" y="162" font-size="9" fill="#b7b2a8">ANE · 100× realtime</text>
  <rect x="462" y="176" width="160" height="38" fill="none" stroke="#1A1918" stroke-width="1.4"/>
  <text x="474" y="195" font-size="11" fill="#1A1918">WHISPER v3</text>
  <text x="474" y="208" font-size="9" fill="#8a857c">multilingual gold</text>
  <rect x="462" y="222" width="160" height="38" fill="none" stroke="#1A1918" stroke-width="1.4"/>
  <text x="474" y="241" font-size="11" fill="#1A1918">GEMMA LiteRT</text>
  <text x="474" y="254" font-size="9" fill="#8a857c">prompt-steerable</text>
  <rect x="462" y="268" width="160" height="38" fill="none" stroke="#E24A2E" stroke-width="2"/>
  <text x="474" y="287" font-size="11" fill="#E24A2E" font-weight="bold">SUPER</text>
  <text x="474" y="300" font-size="9" fill="#8a857c">two engines + referee</text>

  <!-- Diarize -->
  <line x1="640" y1="163" x2="688" y2="163" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="692" y="120" width="150" height="86" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="710" y="150" font-size="13" fill="#1A1918" font-weight="bold">DIARIZE</text>
  <text x="710" y="172" font-size="10.5" fill="#8a857c">who spoke when,</text>
  <text x="710" y="188" font-size="10.5" fill="#8a857c">names inferred</text>

  <!-- Versions -->
  <line x1="842" y1="163" x2="890" y2="163" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="894" y="120" width="150" height="86" fill="none" stroke="#1A1918" stroke-width="2"/>
  <rect x="902" y="128" width="150" height="86" fill="none" stroke="#8a857c" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="912" y="150" font-size="13" fill="#1A1918" font-weight="bold">VERSIONS</text>
  <text x="912" y="172" font-size="10.5" fill="#8a857c">every run kept —</text>
  <text x="912" y="188" font-size="10.5" fill="#8a857c">engines compete</text>

  <!-- bottom row: versions ↓ destutter → presets -->
  <path d="M 969 214 L 969 252" fill="none" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="894" y="258" width="150" height="70" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="912" y="286" font-size="13" fill="#1A1918" font-weight="bold">DESTUTTER</text>
  <text x="912" y="306" font-size="10.5" fill="#8a857c">code, not model</text>
  <line x1="894" y1="293" x2="854" y2="293" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="654" y="258" width="196" height="70" fill="none" stroke="#E24A2E" stroke-width="2"/>
  <text x="672" y="286" font-size="13" fill="#E24A2E" font-weight="bold">LLM PRESETS</text>
  <text x="672" y="306" font-size="10.5" fill="#8a857c">chunked · queued · local</text>
</svg>
