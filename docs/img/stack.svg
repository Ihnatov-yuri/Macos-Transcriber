<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Menlo, ui-monospace, monospace">
  <rect width="1200" height="660" fill="#F4EFE3"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#1A1918" font-weight="bold">THE STACK</text>
  <text x="40" y="72" font-size="11" fill="#8a857c">what is borrowed and what is Yuri code · every box runs on the mac</text>

  <!-- row 1: in -->
  <text x="40" y="142" font-size="9.5" letter-spacing="2" fill="#8a857c">IN</text>
  <rect x="160" y="104" width="230" height="64" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <text x="176" y="128" font-size="11" fill="#1A1918" font-weight="bold">AVAudioEngine</text>
  <text x="176" y="146" font-size="10" fill="#8a857c">mic · voice processing on</text>
  <rect x="400" y="104" width="270" height="64" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <text x="416" y="128" font-size="11" fill="#1A1918" font-weight="bold">CoreAudio process tap</text>
  <text x="416" y="146" font-size="10" fill="#8a857c">+ aggregate device · meeting audio</text>
  <rect x="680" y="104" width="200" height="64" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <text x="696" y="128" font-size="11" fill="#1A1918" font-weight="bold">CGEvent tap</text>
  <text x="696" y="146" font-size="10" fill="#8a857c">the dictation key</text>
  <rect x="890" y="104" width="270" height="64" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <text x="906" y="128" font-size="11" fill="#1A1918" font-weight="bold">Accessibility API</text>
  <text x="906" y="146" font-size="10" fill="#8a857c">app in front, text before caret</text>

  <!-- row 2: decode -->
  <text x="40" y="230" font-size="9.5" letter-spacing="2" fill="#8a857c">DECODE</text>
  <rect x="160" y="192" width="420" height="64" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <text x="176" y="216" font-size="11" fill="#1A1918" font-weight="bold">AVFoundation</text>
  <text x="176" y="234" font-size="10" fill="#8a857c">AVAssetReader, AVAudioFile, AVAudioConverter → 16 kHz mono</text>
  <rect x="590" y="192" width="280" height="64" fill="none" stroke="#E24A2E" stroke-width="1.6"/>
  <text x="606" y="216" font-size="11" fill="#E24A2E" font-weight="bold">silence-aware chunking</text>
  <text x="606" y="234" font-size="10" fill="#8a857c">5-second live feed, speaker-turn windows</text>
  <rect x="880" y="192" width="280" height="64" fill="none" stroke="#E24A2E" stroke-width="1.6"/>
  <text x="896" y="216" font-size="11" fill="#E24A2E" font-weight="bold">NLMS echo canceller</text>
  <text x="896" y="234" font-size="10" fill="#8a857c">on Accelerate · run after the call ends</text>

  <!-- row 3: models -->
  <text x="40" y="318" font-size="9.5" letter-spacing="2" fill="#8a857c">MODELS</text>
  <rect x="160" y="280" width="200" height="64" fill="#1A1918"/>
  <text x="176" y="302" font-size="11" fill="#F4EFE3" font-weight="bold">FluidAudio</text>
  <text x="176" y="318" font-size="10" fill="#b7b2a8">Parakeet TDT · CoreML</text>
  <text x="176" y="332" font-size="10" fill="#b7b2a8">neural engine</text>
  <rect x="370" y="280" width="200" height="64" fill="#1A1918"/>
  <text x="386" y="302" font-size="11" fill="#F4EFE3" font-weight="bold">FluidAudio</text>
  <text x="386" y="318" font-size="10" fill="#b7b2a8">pyannote diarization</text>
  <text x="386" y="332" font-size="10" fill="#b7b2a8">CoreML</text>
  <rect x="580" y="280" width="200" height="64" fill="#1A1918"/>
  <text x="596" y="302" font-size="11" fill="#F4EFE3" font-weight="bold">WhisperKit</text>
  <text x="596" y="318" font-size="10" fill="#b7b2a8">whisper large-v3</text>
  <text x="596" y="332" font-size="10" fill="#b7b2a8">CoreML · gpu</text>
  <rect x="790" y="280" width="200" height="64" fill="#1A1918"/>
  <text x="806" y="302" font-size="11" fill="#F4EFE3" font-weight="bold">LiteRT-LM</text>
  <text x="806" y="318" font-size="10" fill="#b7b2a8">Gemma, audio + text</text>
  <text x="806" y="332" font-size="10" fill="#b7b2a8">metal · cpu</text>
  <rect x="1000" y="280" width="160" height="64" fill="none" stroke="#8a857c" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="1016" y="302" font-size="11" fill="#8a857c" font-weight="bold">cloud apis</text>
  <text x="1016" y="318" font-size="10" fill="#8a857c">openai, anthropic,</text>
  <text x="1016" y="332" font-size="10" fill="#8a857c">gemini · off by default</text>

  <!-- row 4: Yuri code around the models -->
  <text x="40" y="406" font-size="9.5" letter-spacing="2" fill="#E24A2E">YURI</text>
  <rect x="160" y="368" width="192" height="64" fill="none" stroke="#E24A2E" stroke-width="1.6"/>
  <text x="176" y="390" font-size="11" fill="#E24A2E" font-weight="bold">one engine protocol</text>
  <text x="176" y="406" font-size="10" fill="#8a857c">transcribe, generate,</text>
  <text x="176" y="420" font-size="10" fill="#8a857c">capability flags</text>
  <rect x="362" y="368" width="192" height="64" fill="none" stroke="#E24A2E" stroke-width="1.6"/>
  <text x="378" y="390" font-size="11" fill="#E24A2E" font-weight="bold">super mode</text>
  <text x="378" y="406" font-size="10" fill="#8a857c">ROVER word vote,</text>
  <text x="378" y="420" font-size="10" fill="#8a857c">then a referee</text>
  <rect x="564" y="368" width="192" height="64" fill="none" stroke="#E24A2E" stroke-width="1.6"/>
  <text x="580" y="390" font-size="11" fill="#E24A2E" font-weight="bold">the queue</text>
  <text x="580" y="406" font-size="10" fill="#8a857c">one model at a time,</text>
  <text x="580" y="420" font-size="10" fill="#8a857c">watchdog, benching</text>
  <rect x="766" y="368" width="192" height="64" fill="none" stroke="#E24A2E" stroke-width="1.6"/>
  <text x="782" y="390" font-size="11" fill="#E24A2E" font-weight="bold">text mechanics</text>
  <text x="782" y="406" font-size="10" fill="#8a857c">destutter, windows,</text>
  <text x="782" y="420" font-size="10" fill="#8a857c">the baton, commands</text>
  <rect x="968" y="368" width="192" height="64" fill="none" stroke="#E24A2E" stroke-width="1.6"/>
  <text x="984" y="390" font-size="11" fill="#E24A2E" font-weight="bold">names</text>
  <text x="984" y="406" font-size="10" fill="#8a857c">vocabulary lists + names</text>
  <text x="984" y="420" font-size="10" fill="#8a857c">learned from the library</text>

  <!-- row 5: store -->
  <text x="40" y="494" font-size="9.5" letter-spacing="2" fill="#8a857c">STORE</text>
  <rect x="160" y="456" width="240" height="64" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <text x="176" y="480" font-size="11" fill="#1A1918" font-weight="bold">SwiftData</text>
  <text x="176" y="498" font-size="10" fill="#8a857c">one main-actor context</text>
  <rect x="410" y="456" width="240" height="64" fill="none" stroke="#E24A2E" stroke-width="1.6"/>
  <text x="426" y="480" font-size="11" fill="#E24A2E" font-weight="bold">JSON backups</text>
  <text x="426" y="498" font-size="10" fill="#8a857c">written additively, never pruned</text>
  <rect x="660" y="456" width="290" height="64" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <text x="676" y="480" font-size="11" fill="#1A1918" font-weight="bold">AVAudioConverter · AVAssetExportSession</text>
  <text x="676" y="498" font-size="10" fill="#8a857c">aac at 48 kbps · lossless trims</text>
  <rect x="960" y="456" width="200" height="64" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <text x="976" y="480" font-size="11" fill="#1A1918" font-weight="bold">Application Support</text>
  <text x="976" y="498" font-size="10" fill="#8a857c">models live here, not Caches</text>

  <!-- row 6: out -->
  <text x="40" y="582" font-size="9.5" letter-spacing="2" fill="#8a857c">OUT</text>
  <rect x="160" y="544" width="160" height="64" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <text x="174" y="568" font-size="11" fill="#1A1918" font-weight="bold">SwiftUI + menu bar</text>
  <text x="174" y="586" font-size="9.5" fill="#8a857c">the app itself</text>
  <rect x="328" y="544" width="160" height="64" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <text x="342" y="568" font-size="11" fill="#1A1918" font-weight="bold">NSPasteboard + ⌘V</text>
  <text x="342" y="586" font-size="9.5" fill="#8a857c">paste at the cursor</text>
  <rect x="496" y="544" width="160" height="64" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <text x="510" y="568" font-size="11" fill="#1A1918" font-weight="bold">App Intents</text>
  <text x="510" y="586" font-size="9.5" fill="#8a857c">Shortcuts, Siri</text>
  <rect x="664" y="544" width="160" height="64" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <text x="678" y="568" font-size="11" fill="#1A1918" font-weight="bold">URL scheme</text>
  <text x="678" y="586" font-size="9.5" fill="#8a857c">transcriberr://dictate</text>
  <rect x="832" y="544" width="160" height="64" fill="none" stroke="#E24A2E" stroke-width="1.6"/>
  <text x="846" y="568" font-size="11" fill="#E24A2E" font-weight="bold">transcriberrcli</text>
  <text x="846" y="586" font-size="9.5" fill="#8a857c">every stage, headless</text>
  <rect x="1000" y="544" width="160" height="64" fill="none" stroke="#E24A2E" stroke-width="1.6"/>
  <text x="1014" y="568" font-size="11" fill="#E24A2E" font-weight="bold">MCP server</text>
  <text x="1014" y="586" font-size="9.5" fill="#8a857c">json-rpc over stdio</text>

  <text x="160" y="640" font-size="9.5" fill="#8a857c">red outline = Yuri code · black outline = apple frameworks · filled = the packages that run the models</text>
</svg>
