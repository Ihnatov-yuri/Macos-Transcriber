<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="Menlo, ui-monospace, monospace">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#1A1918" stroke-width="1.6"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#E24A2E" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1200" height="430" fill="#F4EFE3"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#1A1918" font-weight="bold">CHUNKED REWRITES — PASS THE BATON</text>
  <text x="40" y="72" font-size="11" fill="#8a857c">a small model is flawless on one page at a time · history keeps the pages continuous</text>

  <!-- source transcript bar -->
  <text x="40" y="122" font-size="11" fill="#1A1918" font-weight="bold">DESTUTTERED TRANSCRIPT</text>
  <rect x="40" y="134" width="340" height="34" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <rect x="384" y="134" width="340" height="34" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <rect x="728" y="134" width="340" height="34" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <text x="180" y="156" font-size="11" fill="#8a857c">window 1</text>
  <text x="524" y="156" font-size="11" fill="#8a857c">window 2</text>
  <text x="868" y="156" font-size="11" fill="#8a857c">window 3</text>
  <text x="40" y="186" font-size="9" fill="#8a857c">~2,600 chars each · split at speaker turns, never mid-turn</text>

  <!-- clean steps -->
  <line x1="210" y1="168" x2="210" y2="228" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="554" y1="168" x2="554" y2="228" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="898" y1="168" x2="898" y2="228" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="222" y="204" font-size="9" fill="#8a857c">LLM cleans</text>
  <text x="566" y="204" font-size="9" fill="#8a857c">LLM cleans</text>
  <text x="910" y="204" font-size="9" fill="#8a857c">LLM cleans</text>

  <rect x="40" y="234" width="340" height="46" fill="#1A1918"/>
  <rect x="384" y="234" width="340" height="46" fill="#1A1918"/>
  <rect x="728" y="234" width="340" height="46" fill="#1A1918"/>
  <text x="160" y="262" font-size="11" fill="#F4EFE3">output 1</text>
  <text x="504" y="262" font-size="11" fill="#F4EFE3">output 2</text>
  <text x="848" y="262" font-size="11" fill="#F4EFE3">output 3</text>

  <!-- batons -->
  <path d="M 350 280 C 350 320, 420 320, 440 288" fill="none" stroke="#E24A2E" stroke-width="2" marker-end="url(#arrR)"/>
  <path d="M 694 280 C 694 320, 764 320, 784 288" fill="none" stroke="#E24A2E" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="330" y="330" font-size="10" fill="#E24A2E" font-weight="bold">the baton: last 400 chars of the</text>
  <text x="330" y="344" font-size="10" fill="#E24A2E" font-weight="bold">finished page opens the next prompt</text>

  <!-- stitched -->
  <path d="M 554 280 L 554 372" fill="none" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="384" y="378" width="340" height="38" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="470" y="402" font-size="11" fill="#1A1918" font-weight="bold">STITCHED RESULT</text>
  <text x="740" y="402" font-size="9" fill="#8a857c">a failed page keeps its source text — nothing is ever lost</text>
</svg>
