name: Transcriberr
options:
  bundleIdPrefix: nl.ihnatov
  deploymentTarget:
    macOS: "26.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6"
    MACOSX_DEPLOYMENT_TARGET: "26.4"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "5.5.0"

# Runtimes: Core ML (FluidAudio: Parakeet, diarizer; WhisperKit: Whisper)
# for speech, MLX (Gemma) and uzu (Qwen) for the text models.
# FluidAudio 0.15.5+ vendors NemoTextProcessing.xcframework whose top-level
# module.modulemap collides with uzu's in Xcode's shared include/ dir.
# Run scripts/patch-artifacts.sh after every package resolve (setup.sh does).
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.17.7
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0
  # Text models on MLX (Gemma 4 E4B, 26B-A4B). Tokenizers come from
  # swift-transformers, already in the graph through WhisperKit, which pins
  # it to 1.1.x. Building it needs Xcode's Metal Toolchain
  # (xcodebuild -downloadComponent MetalToolchain).
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 3.32.3
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    minorVersion: 1.1.9
  # Qwen3.5 9B on uzu (Mirai, MIT): twice MLX's decode speed on copy-edits.
  # A prebuilt binary target; needs macOS 26.4.
  Uzu:
    url: https://github.com/trymirai/uzu
    exactVersion: 0.6.15

targets:
  # uzu in a dynamic framework of its own: its static Rust library and
  # FluidAudio's (libtext_processing_rs) both carry Rust's std, and linked
  # into one binary their `_rust_eh_personality` symbols collide.
  UzuRuntime:
    type: framework
    platform: macOS
    sources:
      - path: UzuRuntime
    dependencies:
      - package: Uzu
        product: Uzu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.ihnatov.UzuRuntime
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete

  TranscriberrTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TranscriberrTests
    dependencies:
      - target: Transcriberr
    settings:
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Transcriberr.app/Contents/MacOS/Transcriberr"
      BUNDLE_LOADER: "$(TEST_HOST)"
      # Same isolation defaults as the app: tests call main-actor-by-default
      # app APIs from synchronous test methods. Swift 5 language mode with
      # complete checking: in Swift 6 mode every XCTestCase subclass's
      # inherited initializers become main-actor and clash with XCTest's
      # nonisolated init(), init(invocation:) and init(selector:). The app
      # and the CLI are Swift 6; modules may mix language modes.
      SWIFT_VERSION: "5"
      SWIFT_STRICT_CONCURRENCY: complete
      SWIFT_APPROACHABLE_CONCURRENCY: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  Transcriberr:
    type: application
    platform: macOS
    sources:
      - path: Transcriberr
    resources:
      - path: Transcriberr/Resources
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: WhisperKit
        product: WhisperKit
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
      - target: UzuRuntime
    # The Transcriberr Microphone HAL plug-in (MicDriver/), shipped in
    # Contents/Resources for Settings to install. Plain C, built with clang:
    # see docs/virtual-microphone.md.
    postCompileScripts:
      - name: Build Transcriberr Microphone driver
        script: |
          "$SRCROOT/scripts/build-mic-driver.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
        inputFiles:
          - $(SRCROOT)/MicDriver/TranscriberrMic.c
          - $(SRCROOT)/MicDriver/Info.plist
          - $(SRCROOT)/scripts/build-mic-driver.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TranscriberrMic.driver/Contents/MacOS/TranscriberrMic
    info:
      path: Transcriberr/Info.plist
      properties:
        CFBundleDisplayName: Transcriberr
        # XcodeGen writes 1.0 / 1 into the plist when these are missing, and
        # the plist wins over the build settings — so the sidebar badge and
        # MCP serverInfo said "1.0" whatever MARKETING_VERSION was.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.4"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Transcriberr records audio from your microphone to transcribe it locally on this Mac.
        NSCalendarsFullAccessUsageDescription: Transcriberr reads the invite of the meeting you recorded (its title and attendees) so their names are spelled right in the transcript. The invite is used on this Mac, and is sent to a cloud engine only when you choose one for a run.
        NSAudioCaptureUsageDescription: Meeting mode records the audio other apps play (your meeting participants) so calls can be transcribed locally on this Mac.
        NSDocumentsFolderUsageDescription: Transcriberr saves recordings, transcripts, and sidecar files alongside your audio.
        NSHumanReadableCopyright: ""
        # transcriberr://dictate/<start|stop|toggle|cancel|pane> — automation hook
        CFBundleURLTypes:
          - CFBundleURLName: nl.ihnatov.Transcriberr
            CFBundleURLSchemes: [transcriberr]
    entitlements:
      path: Transcriberr/Transcriberr.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.ihnatov.Transcriberr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # Swift 6 language mode: every data race the checker finds is an
        # error. Code is main-actor by default; audio, engine and helper code
        # opts out with `nonisolated`.
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_OBJC_BRIDGING_HEADER: Transcriberr/Transcriberr-Bridging-Header.h

  # CLI test harness — exercises the audio pipeline (recorder + decoder +
  # noise suppression) without the SwiftUI / SwiftData stack. Build:
  #   xcodebuild -scheme TranscriberrCLI -derivedDataPath .build/xcode build
  # Then run the binary in .build/xcode/Build/Products/Debug/transcriberrcli.
  TranscriberrCLI:
    type: tool
    platform: macOS
    sources:
      - path: TranscriberrCLI
      - path: Transcriberr/Audio
      - path: Transcriberr/ASR
      - path: Transcriberr/Data
      - path: Transcriberr/Utility
      # AudioDecoder applies the mic-boost gain via UtteranceCapture.applyGain;
      # the rest of Dictation/ is GUI-only.
      - path: Transcriberr/Dictation/UtteranceCapture.swift
    dependencies:
      - package: FluidAudio
        product: FluidAudio
      - package: WhisperKit
        product: WhisperKit
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
      - target: UzuRuntime
    info:
      path: TranscriberrCLI/Info.plist
      properties:
        CFBundleDisplayName: TranscriberrCLI
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "26.4"
        NSMicrophoneUsageDescription: Transcriberrcli records audio from your microphone for pipeline tests.
        NSCalendarsFullAccessUsageDescription: Transcriberrcli reads meeting invites to test the meeting-context pipeline.
    entitlements:
      path: TranscriberrCLI/TranscriberrCLI.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_NAME: transcriberrcli
        # A bare tool has no bundle: its Info.plist only reaches
        # Bundle.main (MCP serverInfo's version) and TCC (the mic prompt
        # text) when linked into the binary's __info_plist section.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        PRODUCT_BUNDLE_IDENTIFIER: nl.ihnatov.TranscriberrCLI
        # The app's floor: the shared ASR/ sources link uzu, which needs 26.4.
        MACOSX_DEPLOYMENT_TARGET: "26.4"
        # Same isolation defaults as the app: the two targets share Audio/,
        # ASR/, Data/ and Utility/, which must infer the same actors.
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # Find frameworks next to the binary (build products dir) or in an
        # app bundle's Frameworks if the CLI ever ships inside
        # Transcriberr.app — without DYLD_LIBRARY_PATH hacks.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path @executable_path/../Frameworks $(inherited)"
        SWIFT_OBJC_BRIDGING_HEADER: Transcriberr/Transcriberr-Bridging-Header.h
        # Skip the playback / waveform extraction code paths that depend
        # on AVPlayer in the GUI target — easier than carving the audio
        # folder up further.
        OTHER_SWIFT_FLAGS: "-D TRANSCRIBERR_CLI"
