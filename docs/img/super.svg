<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" font-family="Menlo, ui-monospace, monospace">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#1A1918" stroke-width="1.6"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#E24A2E" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect width="1200" height="1500" fill="#F4EFE3"/>
  <text x="40" y="52" font-size="15" letter-spacing="3" fill="#1A1918" font-weight="bold">SUPER · TWO ENGINES AND A REFEREE</text>
  <text x="40" y="72" font-size="11" fill="#8a857c">two speech engines hear every chunk · a word vote merges them · Gemma rules only where they fight · all on-device</text>

  <!-- ============ 01 AUDIO IN ============ -->
  <text x="40" y="108" font-size="11" letter-spacing="2" fill="#E24A2E" font-weight="bold">01 · AUDIO IN</text>

  <rect x="40" y="120" width="170" height="60" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="56" y="145" font-size="13" fill="#1A1918" font-weight="bold">MIC TRACK</text>
  <text x="56" y="165" font-size="10" fill="#8a857c">you · ground truth</text>

  <line x1="210" y1="150" x2="246" y2="150" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="250" y="120" width="190" height="60" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="266" y="145" font-size="13" fill="#1A1918" font-weight="bold">ECHO CANCEL</text>
  <text x="266" y="165" font-size="10" fill="#8a857c">NLMS · far side out</text>
  <line x1="440" y1="150" x2="476" y2="150" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="40" y="200" width="170" height="60" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="56" y="225" font-size="13" fill="#1A1918" font-weight="bold">SYSTEM TRACK</text>
  <text x="56" y="245" font-size="10" fill="#8a857c">the others · audio tap</text>
  <line x1="210" y1="230" x2="476" y2="230" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="480" y="120" width="220" height="140" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="496" y="146" font-size="13" fill="#1A1918" font-weight="bold">CHUNKER</text>
  <text x="496" y="170" font-size="10" fill="#8a857c">≤ 28 s, cut in silence</text>
  <text x="496" y="186" font-size="10" fill="#8a857c">1 s recap at each seam</text>
  <text x="496" y="202" font-size="10" fill="#8a857c">mic chunks are "ME"</text>
  <text x="496" y="218" font-size="10" fill="#8a857c">tracks interleave on</text>
  <text x="496" y="234" font-size="10" fill="#8a857c">one timeline</text>

  <!-- diarizer branch from the system track -->
  <polyline points="125,260 125,284 875,284 875,264" fill="none" stroke="#1A1918" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <rect x="800" y="200" width="150" height="60" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="816" y="225" font-size="13" fill="#1A1918" font-weight="bold">DIARIZER</text>
  <text x="816" y="240" font-size="10" fill="#8a857c">who among the</text>
  <text x="816" y="253" font-size="10" fill="#8a857c">others</text>
  <line x1="700" y1="150" x2="736" y2="150" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="740" y="120" width="210" height="60" fill="#1A1918"/>
  <text x="756" y="145" font-size="13" fill="#F4EFE3" font-weight="bold">TO PASS 1</text>
  <text x="756" y="165" font-size="10" fill="#b7b2a8">chunk by chunk</text>

  <rect x="980" y="120" width="180" height="140" fill="none" stroke="#E24A2E" stroke-width="2"/>
  <text x="996" y="146" font-size="13" fill="#E24A2E" font-weight="bold">ENGINE PAIR</text>
  <text x="996" y="170" font-size="9.5" fill="#1A1918">MERGE A × MERGE B</text>
  <text x="996" y="186" font-size="9.5" fill="#8a857c">default Parakeet v3 × v2</text>
  <text x="996" y="202" font-size="9.5" fill="#8a857c">non-English run:</text>
  <text x="996" y="216" font-size="9.5" fill="#8a857c">v2 → Whisper, who leads</text>
  <text x="996" y="238" font-size="9.5" fill="#1A1918">referee: Gemma 4</text>
  <text x="996" y="252" font-size="9.5" fill="#8a857c">LiteRT, text mode only</text>

  <!-- ============ 02 PASS 1 ============ -->
  <rect x="40" y="320" width="1120" height="500" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="60" y="348" font-size="11" letter-spacing="2" fill="#E24A2E" font-weight="bold">02 · PASS 1 — EVERY CHUNK, THREE IN FLIGHT</text>
  <line x1="770" y1="180" x2="770" y2="316" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="70" y="392" width="120" height="70" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="86" y="420" font-size="13" fill="#1A1918" font-weight="bold">CHUNK</text>
  <text x="86" y="442" font-size="10" fill="#8a857c">~26 s audio</text>
  <line x1="190" y1="427" x2="221" y2="427" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="225" y="392" width="150" height="70" fill="none" stroke="#1A1918" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="241" y="420" font-size="13" fill="#1A1918" font-weight="bold">SILENT?</text>
  <text x="241" y="442" font-size="10" fill="#8a857c">peak &lt; 0.005 RMS</text>
  <line x1="300" y1="462" x2="300" y2="486" stroke="#E24A2E" stroke-width="1.6" marker-end="url(#arrR)"/>
  <text x="248" y="502" font-size="9.5" fill="#E24A2E">yes: empty chunk,</text>
  <text x="248" y="515" font-size="9.5" fill="#E24A2E">no engine runs</text>

  <!-- engines in parallel -->
  <polyline points="375,427 395,427 395,394 411,394" fill="none" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <polyline points="395,427 395,464 411,464" fill="none" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="415" y="365" width="190" height="58" fill="#1A1918"/>
  <text x="429" y="388" font-size="12" fill="#F4EFE3" font-weight="bold">ENGINE A</text>
  <text x="429" y="408" font-size="9.5" fill="#b7b2a8">e.g. Whisper v3 · GPU/ANE</text>
  <rect x="415" y="435" width="190" height="58" fill="none" stroke="#1A1918" stroke-width="1.6"/>
  <text x="429" y="458" font-size="12" fill="#1A1918" font-weight="bold">ENGINE B</text>
  <text x="429" y="478" font-size="9.5" fill="#8a857c">e.g. Parakeet v3 · ANE</text>
  <text x="415" y="357" font-size="9.5" fill="#8a857c">in parallel · words + confidences</text>
  <text x="415" y="510" font-size="9" fill="#8a857c">Whisper drops sign-offs and the</text>
  <text x="415" y="522" font-size="9" fill="#8a857c">stock lines it writes over its</text>
  <text x="415" y="534" font-size="9" fill="#8a857c">own 30 s zero padding</text>

  <polyline points="605,394 622,394 622,427 641,427" fill="none" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <polyline points="605,464 622,464 622,427" fill="none" stroke="#1A1918" stroke-width="1.6"/>

  <rect x="645" y="392" width="160" height="70" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="661" y="416" font-size="13" fill="#1A1918" font-weight="bold">PHANTOM?</text>
  <text x="661" y="436" font-size="9.5" fill="#8a857c">"Thank you" that only</text>
  <text x="661" y="450" font-size="9.5" fill="#8a857c">one engine heard: out</text>
  <line x1="805" y1="427" x2="836" y2="427" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="840" y="392" width="130" height="70" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="856" y="416" font-size="13" fill="#1A1918" font-weight="bold">AGREE?</text>
  <text x="856" y="436" font-size="9.5" fill="#8a857c">Dice over the</text>
  <text x="856" y="450" font-size="9.5" fill="#8a857c">two word lists</text>
  <line x1="970" y1="427" x2="1001" y2="427" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="1005" y="380" width="130" height="94" fill="none" stroke="#E24A2E" stroke-width="2.4"/>
  <text x="1021" y="405" font-size="13" fill="#E24A2E" font-weight="bold">WORD VOTE</text>
  <text x="1021" y="425" font-size="9.5" fill="#1A1918">ROVER: align</text>
  <text x="1021" y="439" font-size="9.5" fill="#1A1918">both, decide</text>
  <text x="1021" y="453" font-size="9.5" fill="#1A1918">word by word</text>
  <text x="1021" y="467" font-size="9" fill="#8a857c">CPU · ms</text>

  <!-- gate panel -->
  <rect x="70" y="556" width="540" height="140" fill="none" stroke="#1A1918" stroke-width="1.4"/>
  <text x="86" y="578" font-size="11" fill="#1A1918" font-weight="bold">INFERENCE GATE · READERS-WRITER</text>
  <text x="86" y="598" font-size="9.5" fill="#1A1918">Whisper + Parakeet share it: 3 chunks × 2 engines overlap</text>
  <text x="86" y="613" font-size="9.5" fill="#1A1918">Gemma LiteRT holds it alone: it wedges beside any engine</text>
  <text x="86" y="628" font-size="9.5" fill="#8a857c">a waiting Gemma call blocks new shared calls (no starvation)</text>
  <!-- mini timeline -->
  <text x="86" y="656" font-size="9" fill="#8a857c">shared</text>
  <rect x="140" y="645" width="120" height="14" fill="#1A1918"/>
  <rect x="170" y="662" width="110" height="14" fill="none" stroke="#1A1918" stroke-width="1.2"/>
  <rect x="300" y="652" width="120" height="30" fill="none" stroke="#E24A2E" stroke-width="2"/>
  <text x="312" y="671" font-size="9.5" fill="#E24A2E" font-weight="bold">GEMMA ALONE</text>
  <rect x="440" y="645" width="100" height="14" fill="#1A1918"/>
  <rect x="455" y="662" width="110" height="14" fill="none" stroke="#1A1918" stroke-width="1.2"/>
  <line x1="140" y1="694" x2="590" y2="694" stroke="#8a857c" stroke-width="1"/>
  <text x="560" y="690" font-size="9" fill="#8a857c">time</text>

  <!-- vote rules panel -->
  <rect x="645" y="498" width="440" height="198" fill="none" stroke="#E24A2E" stroke-width="1.4"/>
  <text x="661" y="520" font-size="11" fill="#E24A2E" font-weight="bold">HOW ONE DISPUTED WORD IS DECIDED</text>
  <text x="661" y="544" font-size="9.5" fill="#1A1918">1  same word → the trusted engine's spelling</text>
  <text x="661" y="558" font-size="9.5" fill="#8a857c">   and punctuation, never a mix of both</text>
  <text x="661" y="578" font-size="9.5" fill="#1A1918">2  one reading is in your vocabulary → it wins</text>
  <text x="661" y="598" font-size="9.5" fill="#1A1918">3  trusted engine wrote Latin, the weak one a</text>
  <text x="661" y="612" font-size="9.5" fill="#8a857c">   native-script guess → keep the Latin</text>
  <text x="661" y="632" font-size="9.5" fill="#1A1918">4  otherwise → confidence × language prior</text>
  <text x="661" y="646" font-size="9.5" fill="#8a857c">   (engine weak in this language counts ×0.5)</text>
  <text x="661" y="666" font-size="9.5" fill="#1A1918">5  weak engine's stray extra words dropped</text>
  <text x="661" y="680" font-size="9.5" fill="#8a857c">   unless 3+ in a row (a phrase the other missed)</text>
  <line x1="1070" y1="474" x2="1070" y2="494" stroke="#E24A2E" stroke-width="1.4" stroke-dasharray="3,3"/>

  <!-- cleanup + store (flows right to left) -->
  <polyline points="1135,427 1148,427 1148,755 1139,755" fill="none" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="905" y="720" width="230" height="72" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="921" y="744" font-size="13" fill="#1A1918" font-weight="bold">CLEAN SEAMS</text>
  <text x="921" y="764" font-size="9.5" fill="#8a857c">recap repeat trimmed,</text>
  <text x="921" y="778" font-size="9.5" fill="#8a857c">echoed line dropped</text>
  <line x1="905" y1="756" x2="869" y2="756" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="545" y="720" width="320" height="72" fill="#1A1918"/>
  <text x="561" y="744" font-size="13" fill="#F4EFE3" font-weight="bold">STORED PER CHUNK</text>
  <text x="561" y="764" font-size="9.5" fill="#b7b2a8">voted text (shown live) · raw A · raw B</text>
  <text x="561" y="778" font-size="9.5" fill="#b7b2a8">agreement score</text>
  <text x="70" y="744" font-size="9.5" fill="#8a857c">Max quality OFF: no pass 2. A chunk that</text>
  <text x="70" y="758" font-size="9.5" fill="#8a857c">agrees &lt; 0.5 goes to Gemma right here,</text>
  <text x="70" y="772" font-size="9.5" fill="#8a857c">with only the text before it as context.</text>

  <!-- ============ 03 PASS 2 ============ -->
  <polyline points="705,792 705,845 170,845 170,866" fill="none" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="40" y="870" width="1120" height="290" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="60" y="898" font-size="11" letter-spacing="2" fill="#E24A2E" font-weight="bold">03 · PASS 2 — GEMMA READS FIRST, THEN RULES  (MAX QUALITY)</text>

  <rect x="70" y="915" width="300" height="130" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="86" y="940" font-size="13" fill="#1A1918" font-weight="bold">READ THE WHOLE THING</text>
  <text x="86" y="962" font-size="9.5" fill="#8a857c">the voted transcript, in 3k-token</text>
  <text x="86" y="976" font-size="9.5" fill="#8a857c">sections (larger reads wedge LiteRT)</text>
  <text x="86" y="996" font-size="9.5" fill="#1A1918">→ brief: topic, people,</text>
  <text x="86" y="1010" font-size="9.5" fill="#1A1918">  names as spelled here</text>
  <text x="86" y="1030" font-size="9.5" fill="#8a857c">+ spelling fixes that survive guards</text>
  <line x1="370" y1="980" x2="406" y2="980" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="410" y="915" width="230" height="130" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="426" y="940" font-size="13" fill="#1A1918" font-weight="bold">PICK DISPUTES</text>
  <text x="426" y="962" font-size="9.5" fill="#1A1918">agreement &lt; 0.8</text>
  <text x="426" y="978" font-size="9.5" fill="#1A1918">worst 10, no more</text>
  <text x="426" y="1000" font-size="9.5" fill="#8a857c">everything else keeps</text>
  <text x="426" y="1014" font-size="9.5" fill="#8a857c">its word vote</text>
  <line x1="640" y1="980" x2="676" y2="980" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="680" y="915" width="260" height="130" fill="#1A1918"/>
  <text x="696" y="940" font-size="13" fill="#F4EFE3" font-weight="bold">GEMMA RULES</text>
  <text x="696" y="962" font-size="9.5" fill="#b7b2a8">sees raw A and raw B, the text</text>
  <text x="696" y="976" font-size="9.5" fill="#b7b2a8">BEFORE and AFTER the chunk,</text>
  <text x="696" y="990" font-size="9.5" fill="#b7b2a8">your vocabulary, the brief</text>
  <text x="696" y="1012" font-size="9.5" fill="#F4EFE3">told to choose between</text>
  <text x="696" y="1026" font-size="9.5" fill="#F4EFE3">readings, never to invent</text>
  <line x1="940" y1="980" x2="976" y2="980" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="980" y="915" width="155" height="130" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="996" y="940" font-size="13" fill="#1A1918" font-weight="bold">SPLICE</text>
  <text x="996" y="962" font-size="9.5" fill="#8a857c">ruling replaces</text>
  <text x="996" y="976" font-size="9.5" fill="#8a857c">the chunk</text>
  <text x="996" y="998" font-size="9.5" fill="#E24A2E">&gt; 120 s: keep</text>
  <text x="996" y="1012" font-size="9.5" fill="#E24A2E">the vote</text>

  <text x="70" y="1080" font-size="10" fill="#1A1918">Why two passes: most chunks agree and never needed context. Pass 1 runs flat out with Gemma idle;</text>
  <text x="70" y="1096" font-size="10" fill="#1A1918">the slow judgment is spent only where the engines actually fought, with context from both sides.</text>
  <text x="70" y="1120" font-size="9.5" fill="#8a857c">measured, 42-min meeting: first pass ~96% of run time · arbitration + brief ~1 min</text>
  <text x="70" y="1136" font-size="9.5" fill="#8a857c">v3.8.0 overlap: 6-min slice 241 s → 183 s, same words</text>

  <!-- ============ 04 FINALIZE ============ -->
  <line x1="600" y1="1160" x2="600" y2="1196" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="40" y="1218" font-size="11" letter-spacing="2" fill="#E24A2E" font-weight="bold">04 · FINALIZE</text>

  <rect x="40" y="1230" width="230" height="70" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="56" y="1256" font-size="13" fill="#1A1918" font-weight="bold">APPLY FIXES</text>
  <text x="56" y="1276" font-size="9.5" fill="#8a857c">the brief's guarded spellings</text>
  <line x1="270" y1="1265" x2="306" y2="1265" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="310" y="1230" width="230" height="70" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="326" y="1256" font-size="13" fill="#1A1918" font-weight="bold">ECHO SCRUB</text>
  <text x="326" y="1276" font-size="9.5" fill="#8a857c">a sys line heard again on</text>
  <text x="326" y="1290" font-size="9.5" fill="#8a857c">your mic: keep one copy</text>
  <line x1="540" y1="1265" x2="576" y2="1265" stroke="#1A1918" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="580" y="1230" width="300" height="70" fill="none" stroke="#1A1918" stroke-width="2"/>
  <text x="596" y="1256" font-size="13" fill="#1A1918" font-weight="bold">SPEAKERS + NAMES</text>
  <text x="596" y="1276" font-size="9.5" fill="#8a857c">mic = you · diarizer regions for</text>
  <text x="596" y="1290" font-size="9.5" fill="#8a857c">the others · names from the talk</text>
  <line x1="880" y1="1265" x2="916" y2="1265" stroke="#E24A2E" stroke-width="1.6" marker-end="url(#arrR)"/>

  <rect x="920" y="1230" width="240" height="70" fill="#E24A2E"/>
  <text x="936" y="1258" font-size="13" fill="#F4EFE3" font-weight="bold">TRANSCRIPT</text>
  <text x="936" y="1278" font-size="9.5" fill="#F4EFE3">saved as a new version</text>

  <!-- ============ SAFETY RAIL ============ -->
  <rect x="40" y="1340" width="1120" height="120" fill="none" stroke="#1A1918" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="60" y="1366" font-size="11" letter-spacing="2" fill="#1A1918" font-weight="bold">IF AN ENGINE HANGS</text>
  <text x="60" y="1392" font-size="10" fill="#1A1918">chunk over 120 s → rebuild that engine → retry → still stuck: the healthy engine does the chunk alone</text>
  <text x="60" y="1410" font-size="10" fill="#1A1918">two hangs in one run → Gemma is benched and the rest of the run is single-engine, so it finishes</text>
  <text x="60" y="1436" font-size="9.5" fill="#8a857c">before a chunk is given up, it falls back to one engine's reading instead of two</text>
</svg>
